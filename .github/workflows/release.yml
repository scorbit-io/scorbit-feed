name: Release npm

# INERT until two things exist: the @scorbit organisation on npmjs.com, and a
# trusted publisher on the @scorbit/feed package pointing at this repository,
# this workflow file (release.yml) and the `npm` environment. Until then the
# publish step fails with an authentication error and nothing is published.
# No NPM_TOKEN secret is used or wanted: trusted publishing authenticates with
# the job's OIDC token (id-token: write), and npm attaches provenance itself.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to publish to npm
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify release tag input
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "Release tag is required"
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify release tag matches VERSION and package.json
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$RELEASE_TAG" ]; then
            echo "VERSION file (${VERSION}) does not match release tag (${RELEASE_TAG})"
            exit 1
          fi
          if [ "$PACKAGE_VERSION" != "$RELEASE_TAG" ]; then
            echo "package.json version (${PACKAGE_VERSION}) does not match release tag (${RELEASE_TAG})"
            exit 1
          fi

      # Trusted publishing needs npm CLI 11.5.1+ and Node 22.14.0+. Every Node 24
      # LTS release ships npm 11.6 or newer, so no npm upgrade step is needed.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache in a release build

      - name: Show npm version
        run: npm --version

      - run: npm ci

      - name: Check (lint, typecheck, 100% coverage, build, package contents)
        run: npm run check

      # --ignore-scripts: prepublishOnly would re-run the check that just passed.
      - name: Publish
        run: npm publish --provenance --access public --ignore-scripts
